<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقارنة النماذج الحضرية ثلاثية الأبعاد</title>
<!-- الخطوط العربية -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
<!-- Three.js و OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0d1117;font-family:'Cairo','Tajawal',sans-serif;overflow:hidden;color:#eef4fb;user-select:none;-webkit-user-select:none;width:100vw;height:100vh}
:root{--accent:#38bdf8;--accent-soft:rgba(56,189,248,.4)}
body.mode-developing{--accent:#f5a524;--accent-soft:rgba(245,165,36,.4)}

#webgl-container{position:fixed;inset:0;z-index:1}
#webgl-container canvas{display:block;touch-action:none}
#vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.32) 100%)}

/* علامات ثلاثية الأبعاد تطفو فوق الأحياء (غير حاجبة للتصميم) */
#labels{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.zone-label{position:absolute;transform:translate(-50%,-135%);display:flex;align-items:center;gap:6px;background:rgba(8,12,20,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600;color:#dbe6f3;cursor:pointer;pointer-events:auto;white-space:nowrap;transition:background .2s,border-color .2s}
.zone-label::after{content:'';position:absolute;top:100%;right:50%;width:1px;height:13px;background:rgba(255,255,255,.35)}
.zone-label .ldot{width:7px;height:7px;border-radius:50%;background:var(--zc);flex:none}
.zone-label:hover{background:rgba(22,32,50,.9)}
.zone-label.active{border-color:rgba(255,255,255,.5);color:#fff}

/* شريط تبديل المدينة */
#mode-bar{position:fixed;top:18px;right:50%;transform:translateX(50%);z-index:5;display:flex;gap:6px;background:rgba(10,14,22,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);padding:6px;border-radius:999px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.mode-btn{display:flex;align-items:center;gap:8px;background:transparent;border:none;color:#93a4b8;padding:8px 18px;font-family:inherit;font-size:.92rem;font-weight:700;border-radius:999px;cursor:pointer;transition:all .25s ease}
.mode-btn svg{width:17px;height:17px;flex:none}
.mode-btn:hover{color:#e8f0fa}
.mode-btn.active{background:var(--accent);color:#0a1017;box-shadow:0 4px 18px var(--accent-soft)}

/* شريط أدوات صغير: العلامات + الدوران */
#toolbar{position:fixed;top:22px;left:20px;z-index:5;display:flex;flex-direction:column;gap:6px}
.chip{display:flex;align-items:center;gap:7px;background:rgba(10,14,22,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.09);color:#8fa1b5;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit;transition:all .2s}
.chip .led{width:6px;height:6px;border-radius:50%;background:#4a5568;transition:all .2s}
.chip.on{color:#e6eef8;border-color:rgba(255,255,255,.22)}
.chip.on .led{background:var(--accent);box-shadow:0 0 7px var(--accent)}

/* شريط الأحياء السفلي */
#zone-dock{position:fixed;bottom:18px;right:50%;transform:translateX(50%);z-index:5;display:flex;gap:6px;background:rgba(10,14,22,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09);padding:6px;border-radius:999px;max-width:min(92vw,760px);overflow-x:auto;scrollbar-width:none}
#zone-dock::-webkit-scrollbar{display:none}
.zone-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.04);border:1px solid transparent;color:#aebccb;font-family:inherit;font-size:.82rem;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .2s}
.zone-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--zc);opacity:.9;flex:none}
.zone-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.zone-btn.active{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.28)}

/* بطاقة المعلومات المنزلقة (تظهر عند اختيار حي فقط) */
#panel{position:fixed;bottom:20px;left:20px;z-index:5;width:302px;max-width:calc(100vw - 40px);max-height:min(56vh,470px);overflow-y:auto;background:rgba(10,15,24,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:0 18px 44px rgba(0,0,0,.5);transition:opacity .35s,transform .35s;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
#panel.hidden{opacity:0;transform:translateY(14px);pointer-events:none}
.panel-accent{height:3px;border-radius:3px 3px 0 0;background:var(--zc,#38bdf8);opacity:.9}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 4px}
.panel-title-wrap{display:flex;align-items:center;gap:9px}
.panel-dot{width:9px;height:9px;border-radius:50%;background:var(--zc);flex:none}
#panel h2{font-size:1.02rem;font-weight:800;color:#f2f7fd}
#panel-close{background:rgba(255,255,255,.06);border:none;width:26px;height:26px;border-radius:8px;color:#8fa1b5;cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s;flex:none}
#panel-close:hover{background:rgba(255,255,255,.15);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 16px 2px}
.chips span{font-size:10.5px;font-weight:700;color:#c6d4e2;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:2.5px 9px;border-radius:999px}
.panel-desc{font-family:'Tajawal',sans-serif;font-weight:300;font-size:.84rem;line-height:1.8;color:#aebccb;padding:8px 16px 4px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 16px 16px}
.spec{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);border-radius:9px;padding:7px 9px}
.spec span{display:block;font-size:9.5px;color:#6d7f92;margin-bottom:2px;font-weight:600}
.spec strong{font-size:11px;color:#dbe6f1;font-weight:700;line-height:1.5}

/* تلميح التحكم */
#hint{position:fixed;bottom:24px;right:20px;z-index:4;font-size:10.5px;color:rgba(230,240,250,.45);background:rgba(8,12,20,.45);backdrop-filter:blur(6px);padding:5px 11px;border-radius:999px;pointer-events:none}

/* شاشة التحميل */
#loader{position:fixed;inset:0;background:#090d16;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;transition:opacity .7s ease}
#loader.done{opacity:0;pointer-events:none}
.spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.1);border-top:3px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{margin-top:16px;color:#8b949e;font-size:.9rem}

@media (max-width:760px){
  #mode-bar{top:12px;padding:4px}
  .mode-btn{padding:7px 12px;font-size:.8rem}
  #toolbar{top:64px;left:12px}
  #panel{left:12px;right:12px;width:auto;bottom:70px;max-height:36vh}
  #hint{display:none}
  #zone-dock{bottom:12px;max-width:96vw}
}
</style>
</head>
<body class="mode-developed">

<div id="loader"><div class="spinner"></div><p>جاري بناء المشهد الحضري...</p></div>

<div id="webgl-container"></div>
<div id="vignette"></div>
<div id="labels"></div>

<!-- تبديل النموذج الحضري -->
<header id="mode-bar">
  <button id="btn-developed" class="mode-btn active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21h18M5 21V10l4-3v14M9 21V6h6v15M15 21V11l4 2v8"/></svg>
    المدينة المتقدمة
  </button>
  <button id="btn-developing" class="mode-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21h18M6 21v-8l3-2 3 2v8M15 21V9h5v12M13 4h7M16.5 4v4M16.5 8l-2.5 2.5M16.5 8l2.5 2.5"/></svg>
    المدينة النامية
  </button>
</header>

<!-- أدوات: إظهار العلامات / الدوران التلقائي -->
<div id="toolbar">
  <button id="chip-labels" class="chip on"><span class="led"></span>العلامات</button>
  <button id="chip-rotate" class="chip on"><span class="led"></span>دوران تلقائي</button>
</div>

<nav id="zone-dock"></nav>

<!-- بطاقة معلومات الحي -->
<aside id="panel">
  <div class="panel-accent"></div>
  <header class="panel-head">
    <div class="panel-title-wrap">
      <span class="panel-dot"></span>
      <h2 id="panel-title"></h2>
    </div>
    <button id="panel-close" aria-label="إغلاق">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="chips" id="panel-chips"></div>
  <p class="panel-desc" id="panel-desc"></p>
  <div class="specs" id="panel-specs"></div>
</aside>

<div id="hint">سحب: تدوير · عجلة: تقريب · انقر المباني أو العلامات لاستكشاف الأحياء</div>

<script>
/* ================= أدوات عامة ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= المشهد والكاميرا والمصير ================= */
const container=document.getElementById('webgl-container');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.5,1500);
camera.position.set(118,88,158);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
container.appendChild(renderer.domElement);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;
controls.maxPolarAngle=Math.PI/2-.04;
controls.minDistance=22;controls.maxDistance=420;
controls.autoRotate=true;controls.autoRotateSpeed=.45;
controls.target.set(0,18,0);

const hemi=new THREE.HemisphereLight(0x6f9fd8,0x0e141d,.55);
const dirL=new THREE.DirectionalLight(0xbcd2ff,.75);
dirL.position.set(140,180,90);dirL.castShadow=true;
dirL.shadow.mapSize.set(2048,2048);
dirL.shadow.camera.left=-180;dirL.shadow.camera.right=180;
dirL.shadow.camera.top=180;dirL.shadow.camera.bottom=-180;
dirL.shadow.camera.near=20;dirL.shadow.camera.far=520;
dirL.shadow.bias=-.0004;
const amb=new THREE.AmbientLight(0x1c2534,.6);
scene.add(hemi,dirL,dirL.target,amb);

/* أجواء كل مدينة: ليل أزرق بارد للتقدمة / غسق رملي دافئ للنامية */
const ATMO={
 developed:{bg:0x0a121e,fog:[150,520],hemi:[0x6f9fd8,0x0e141d,.55],dir:[0xbcd2ff,.75,[140,180,90]],amb:[0x1c2534,.6]},
 developing:{bg:0x26190e,fog:[140,500],hemi:[0xd08c46,0x201207,.5],dir:[0xffb066,.85,[-150,150,-60]],amb:[0x2b1d10,.65]}
};
function applyAtmo(m){const a=ATMO[m];
 scene.background=new THREE.Color(a.bg);
 if(!scene.fog)scene.fog=new THREE.Fog(a.bg,a.fog[0],a.fog[1]);
 scene.fog.color.set(a.bg);scene.fog.near=a.fog[0];scene.fog.far=a.fog[1];
 hemi.color.set(a.hemi[0]);hemi.groundColor.set(a.hemi[1]);hemi.intensity=a.hemi[2];
 dirL.color.set(a.dir[0]);dirL.intensity=a.dir[1];dirL.position.set(a.dir[2][0],a.dir[2][1],a.dir[2][2]);
 amb.color.set(a.amb[0]);amb.intensity=a.amb[1];
}

/* ================= بناة العناصر ================= */
const beacons=[],cars=[];

/* نسيج واجهات بنوافذ مضيئة (خريطة لون + خريطة توهج) */
function facadeTex(cols,rows,wall,lits,ratio,seed){
 const cw=14,ch=16,W=cols*cw,H=rows*ch;
 const cm=document.createElement('canvas');cm.width=W;cm.height=H;
 const ce=document.createElement('canvas');ce.width=W;ce.height=H;
 const gm=cm.getContext('2d'),ge=ce.getContext('2d');
 gm.fillStyle=wall;gm.fillRect(0,0,W,H);
 ge.fillStyle='#000';ge.fillRect(0,0,W,H);
 let s=(Math.abs(seed)|0)%2147483646+1;
 const rnd=()=>{s=s*16807%2147483647;return s/2147483647};
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
  const px=x*cw,py=y*ch;
  if(rnd()<ratio){const c=lits[(rnd()*lits.length)|0];
   gm.fillStyle=c;gm.fillRect(px+2,py+4,cw-4,ch-7);
   ge.fillStyle=c;ge.fillRect(px+2,py+4,cw-4,ch-7);
  }else{gm.fillStyle='rgba(14,20,30,.85)';gm.fillRect(px+2,py+4,cw-4,ch-7);}
 }
 const tm=new THREE.CanvasTexture(cm);tm.encoding=THREE.sRGBEncoding;
 return{map:tm,em:new THREE.CanvasTexture(ce)};
}

/* برج بواجهة نوافذ وسطح داكن */
function tower(w,h,d,pal,seed){
 const cols=Math.max(3,Math.round(w/1.7)),rows=Math.max(4,Math.round(h/2.6));
 const t=facadeTex(cols,rows,pal.wall,pal.lit,pal.ratio,seed);
 const side=new THREE.MeshStandardMaterial({map:t.map,emissiveMap:t.em,emissive:0xffffff,emissiveIntensity:pal.ei,roughness:.55,metalness:.3});
 const top=new THREE.MeshStandardMaterial({color:pal.roof,roughness:.95});
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[side,side,top,top,side,side]);
 m.castShadow=true;m.receiveShadow=true;return m;
}
function solid(w,h,d,color,rough){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:rough??.9}));
 m.castShadow=true;m.receiveShadow=true;return m;
}
function planeM(w,d,color,y,x,z,o){
 o=o||{};
 const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshStandardMaterial({color,roughness:o.rough??1,metalness:o.metal??0}));
 m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;return m;
}
function tank(g,x,y,z){
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.65,.65,1.15,8),new THREE.MeshStandardMaterial({color:0x232b36,roughness:.7}));
 t.position.set(x,y+.6,z);t.castShadow=true;g.add(t);
}
function addCar(g,o){
 const grp=new THREE.Group();
 const L=o.l||3.6;
 const body=solid(L,.85,1.7,o.color,.55);body.position.y=.55;grp.add(body);
 const cab=solid(L*.48,.55,1.45,0x1c242e,.35);cab.position.set(-.2,1.18,0);grp.add(cab);
 if(o.axis==='x')grp.rotation.y=Math.PI/2;
 g.add(grp);
 cars.push({m:grp,axis:o.axis,fixed:o.fixed,from:o.from,to:o.to,speed:o.speed,off:o.off||0});
}
function buildTrees(g,list,o){
 if(!list.length)return;
 o=Object.assign({trunkH:1.7,crownR:1.8,crownH:4.4,color:0x2f5d33,sMin:.8,sMax:1.4},o);
 const crown=new THREE.InstancedMesh(new THREE.ConeGeometry(o.crownR,o.crownH,8),new THREE.MeshStandardMaterial({color:o.color,roughness:1}),list.length);
 const trunk=new THREE.InstancedMesh(new THREE.CylinderGeometry(.18,.28,1,5),new THREE.MeshStandardMaterial({color:0x4a3623,roughness:1}),list.length);
 const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),E=new THREE.Euler(),P=new THREE.Vector3(),S=new THREE.Vector3();
 list.forEach((p,i)=>{
  const s=Math.min(o.sMax,Math.max(o.sMin,p.s||1));
  E.set(0,p.r||0,0);Q.setFromEuler(E);
  P.set(p.x,o.trunkH*s+o.crownH*.5*s,p.z);S.set(s,s,s);M.compose(P,Q,S);crown.setMatrixAt(i,M);
  P.set(p.x,o.trunkH*s*.5,p.z);S.set(1,o.trunkH*s,1);M.compose(P,Q,S);trunk.setMatrixAt(i,M);
 });
 crown.castShadow=true;g.add(crown,trunk);
}
function addVilla(g,x,z,o){
 g.add(planeM(17,17,o.lawn,.045,x,z));
 const base=solid(7.2,3.1,6.6,o.wall);base.position.set(x,1.55,z);g.add(base);
 const up=solid(5.2,2.7,5.2,o.wall);up.position.set(x+.9,4.45,z-.5);g.add(up);
 const slab=solid(6.1,.3,6.1,0x8d8676);slab.position.set(x+.9,5.95,z-.5);g.add(slab);
 if(o.pool)g.add(planeM(4.4,2.8,0x2fa3c7,.06,x-4.4,z+3.4,{rough:.15,metal:.2}));
 const n=2+((o.rnd()*2)|0);
 for(let i=0;i<n;i++){const a=o.rnd()*Math.PI*2,r=6+o.rnd()*3;o.trees.push({x:x+Math.cos(a)*r,z:z+Math.sin(a)*r,s:.7+o.rnd()*.7});}
}
function fillRing(g,rng,count,avoid,roadClear,palFn,seedBase){
 const placed=[];let guard=0;
 while(placed.length<count&&guard++<500){
  const x=(rng()*2-1)*150,z=(rng()*2-1)*150;
  if(Math.hypot(x,z)>150)continue;
  if(avoid.some(a=>Math.hypot(x-a[0],z-a[1])<a[2]))continue;
  if(roadClear&&!roadClear(x,z))continue;
  if(placed.some(p=>Math.hypot(x-p[0],z-p[1])<17))continue;
  placed.push([x,z]);
  const w=8+rng()*8,d=8+rng()*8,h=hMin+rng()*hVar,hMin=0;/*placeholder*/
 }
 return placed;
}

/* ================= مدينة العالم المتقدم ================= */
const devCity=new THREE.Group();scene.add(devCity);
const devTrees=[];const rngD=mulberry32(101);
(function buildDeveloped(){
 devCity.add(planeM(360,360,0x10161f,0,0,0));
 /* الطرقات */
 devCity.add(planeM(12,340,0x222c3a,.03,0,0));
 devCity.add(planeM(340,12,0x222c3a,.03,0,0));
 devCity.add(planeM(170,8,0x222c3a,.03,-85,0));
 devCity.add(planeM(180,8,0x222c3a,.03,45,30));
 /* رصيف المركز */
 devCity.add(planeM(72,72,0x1a2230,.02,0,0));

 /* حي الأعمال: أبراج زجاجية */
 const PALS=[
  {wall:'#1b2b40',lit:['#ffd9a3','#cfe6ff','#ffe9c4'],ratio:.55,ei:.9,roof:'#0c1420'},
  {wall:'#223047',lit:['#ffd9a3','#9fd0ff'],ratio:.45,ei:.8,roof:'#0d1622'},
  {wall:'#1a2433',lit:['#ffe2b0','#bfe0ff'],ratio:.6,ei:1,roof:'#0b111a'}
 ];
 const defs=[[-22,-18,11,11,58],[0,-24,13,13,95],[18,-14,10,10,66],[34,4,9,9,46],[-32,2,10,12,74],[-12,12,12,10,52],[12,12,9,9,62],[26,20,10,10,40],[-26,22,11,9,48]];
 defs.forEach((t,i)=>{
  const x=t[0],z=t[1],w=t[2],d=t[3],h=t[4];
  const tw=tower(w,h,d,PALS[i%3],100+i*13);tw.position.set(x,h/2,z);devCity.add(tw);
  if(h>=46){const pod=solid(w+7,5,d+7,0x1a2330);pod.position.set(x,2.5,z);devCity.add(pod);}
  if(h>=60){
   const ant=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,9,6),new THREE.MeshStandardMaterial({color:0x39424e}));
   ant.position.set(x,h+4.5,z);devCity.add(ant);

   specs:[['الوظيفة الاقتصادية','بنوك وشركات واستثمار أجنبي'],['الوظيفة الخدمية','فنادق ومقرات خدمية'],['النمط المعماري','زجاج حديث وخرسانة متوسطة'],['ارتفاع البنايات','15 – 70 م'],['ملاحظة','مبانٍ قيد الإنشاء حول الأبراج'],['قيمة الأرض','مرتفعة ومحصورة']]},
  {id:'dg-rich',label:'أحياء الأغنياء',color:'#34d399',anchor:[72,13,45],center:[72,45],cam:{p:[120,34,96],t:[72,5,45]},
   chips:['سكني مغلق','خدمة ذاتية'],
   desc:'مجمعات مسوّرة ببوابة وحراسة: فلل واسعة بحديقة ونخيل ومسبح، مع مولدات وخزانات خاصة تعوّض ضعف الخدمات العامة؛ عزلة مكانية واضحة عن المحيط الحضري.',
   specs:[['الوظيفة السكنية','فلل مملوكة داخل مجمع مسوّر'],['الوظيفة الخدمية','حراسة ومولدات وخزانات خاصة'],['النمط المعماري','فلل حديثة داخل أسوار'],['الكثافة','منخفضة'],['البنية التحتية','خدمة ذاتية بديلة عن العامة'],['مستوى الدخل','مرتفع جداً']]},
  {id:'dg-mp',label:'ضواحي المتوسطة والفقيرة',color:'#f59e0b',anchor:[-72,13,45],center:[-74,45],cam:{p:[-120,34,96],t:[-74,5,45]},
   chips:['سكني','خدمات جزئية'],
   desc:'صفوف من بيوت الخرسانة تتدرج جودتها غرباً شرقاً: بيوت متوسطة بطابقين وخزانات مياه ومسجد الحي، ثم وحدات فقيرة أصغر بكثافة أعلى وبعض أسقف الصفيح؛ خدمات جزئية وشوارع غير ممهدة.',
   specs:[['الوظيفة السكنية','ملكية شعبية وإيجارات متدنية'],['الوظيفة الخدمية','مدارس حكومية وأسواق شعبية'],['النمط المعماري','بيوت خرسانية 1 – 2 طابق'],['الكثافة','متوسطة ترتفع في القسم الفقير'],['البنية التحتية','مياه وكهرباء جزئية'],['التدرج','الأفضل غرباً والأفقر شرقاً']]},
  {id:'dg-tin',label:'الأحياء القصديرية',color:'#ef4444',anchor:[-60,9,-70],center:[-60,-70],cam:{p:[-92,25,-108],t:[-60,3,-70]},
   chips:['عشوائي','إسكان طارئ'],
   desc:'الحلقة الأخيرة للمدينة: أكواخ من الصفيح والخشب المُعاد استخدامه بأسقف صدئة متراصة فوق أرض ترابية، تُشيَّد عفوياً دون تصاميم أو تراخيص، بلا مياه أو صرف صحي أو كهرباء نظامية.',
   specs:[['الوظيفة السكنية','إسكان عفوي طارئ'],['الوظيفة الاقتصادية','عمالة غير رسمية وحرفية'],['الوظيفة الخدمية','شبه معدومة'],['النمط المعماري','صفيح وخشب وأسقف صدئة'],['الكثافة','عالية جداً ومتراصة'],['البنية التحتية','غياب شبه كامل']]}
 ]
};

/* ================= الواجهة والتفاعل ================= */
const labelsEl=document.getElementById('labels');
const dockEl=document.getElementById('zone-dock');
const panel=document.getElementById('panel');
const panelDot=panel.querySelector('.panel-dot');
const panelTitle=document.getElementById('panel-title');
const chipsEl=document.getElementById('panel-chips');
const descEl=document.getElementById('panel-desc');
const specsEl=document.getElementById('panel-specs');
const btnDev=document.getElementById('btn-developed');
const btnDevg=document.getElementById('btn-developing');
const labelsChip=document.getElementById('chip-labels');
const rotChip=document.getElementById('chip-rotate');

let currentCity='developed',activeZone=null,camTween=null,desiredRotate=true,labelsOn=true;

function fillPanel(z){
 panel.style.setProperty('--zc',z.color);
 panelDot.style.background=z.color;
 panelTitle.textContent=z.label;
 chipsEl.innerHTML=z.chips.map(c=>'<span>'+c+'</span>').join('');
 descEl.textContent=z.desc;
 specsEl.innerHTML=z.specs.map(s=>'<div class="spec"><span>'+s[0]+'</span><strong>'+s[1]+'</strong></div>').join('');
 panel.classList.remove('hidden');
}
function flyTo(cam){
 controls.autoRotate=false;
 camTween={t0:performance.now(),dur:1500,
  p0:camera.position.clone(),p1:new THREE.Vector3(cam.p[0],cam.p[1],cam.p[2]),
  q0:controls.target.clone(),q1:new THREE.Vector3(cam.t[0],cam.t[1],cam.t[2])};
}
function selectZone(id,fly){
 const z=ZONES[currentCity].find(x=>x.id===id);if(!z)return;
 activeZone=id;
 document.querySelectorAll('.zone-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
 document.querySelectorAll('.zone-label').forEach(l=>l.classList.toggle('active',l.dataset.id===id));
 fillPanel(z);
 if(fly!==false){
  flyTo(z.cam);
  if(desiredRotate){desiredRotate=false;rotChip.classList.remove('on');}
 }
}
function buildDock(){
 dockEl.innerHTML='';
 ZONES[currentCity].forEach(z=>{
  const b=document.createElement('button');
  b.className='zone-btn'+(z.id===activeZone?' active':'');
  b.dataset.id=z.id;
  b.innerHTML='<span class="dot" style="--zc:'+z.color+'"></span>'+z.label;
  b.addEventListener('click',()=>selectZone(z.id));
  dockEl.appendChild(b);
 });
}
function buildLabels(){
 labelsEl.innerHTML='';
 ZONES[currentCity].forEach(z=>{
  if(!z.anchor)return;
  const l=document.createElement('div');
  l.className='zone-label'+(z.id===activeZone?' active':'');
  l.dataset.id=z.id;
  l.style.setProperty('--zc',z.color);
  l.innerHTML='<span class="ldot"></span>'+z.label;
  l.addEventListener('click',()=>selectZone(z.id));
  z.el=l;labelsEl.appendChild(l);
 });
}
function switchCity(m){
 if(m===currentCity)return;
 currentCity=m;
 devCity.visible=(m==='developed');
 devgCity.visible=(m==='developing');
 document.body.classList.toggle('mode-developing',m==='developing');
 btnDev.classList.toggle('active',m==='developed');
 btnDevg.classList.toggle('active',m==='developing');
 applyAtmo(m);
 activeZone=null;
 buildDock();buildLabels();
 selectZone(ZONES[m][0].id,true);
}
btnDev.addEventListener('click',()=>switchCity('developed'));
btnDevg.addEventListener('click',()=>switchCity('developing'));

panel.querySelector('#panel-close').addEventListener('click',()=>panel.classList.add('hidden'));

labelsChip.addEventListener('click',()=>{
 labelsOn=!labelsOn;
 labelsEl.style.display=labelsOn?'block':'none';
 labelsChip.classList.toggle('on',labelsOn);
});
rotChip.addEventListener('click',()=>{
 desiredRotate=!desiredRotate;
 controls.autoRotate=desiredRotate&&!camTween;
 rotChip.classList.toggle('on',desiredRotate);
});
controls.addEventListener('start',()=>{
 desiredRotate=false;controls.autoRotate=false;rotChip.classList.remove('on');
});

/* النقر على المباني ينتقل لأقرب حي */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
let downX=0,downY=0;
renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;});
renderer.domElement.addEventListener('pointerup',e=>{
 if(Math.hypot(e.clientX-downX,e.clientY-downY)>6)return;
 ptr.x=(e.clientX/innerWidth)*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;
 ray.setFromCamera(ptr,camera);
 const grp=(currentCity==='developed')?devCity:devgCity;
 const hits=ray.intersectObjects(grp.children,true);
 if(!hits.length)return;
 const p=hits[0].point;let best=null,bd=1e9;
 ZONES[currentCity].forEach(z=>{
  if(!z.center)return;
  const d=Math.hypot(p.x-z.center[0],p.z-z.center[1]);
  if(d<bd){bd=d;best=z;}
 });
 if(best&&bd<62)selectZone(best.id);
});

/* ================= تحديث العلامات العائمة ================= */
const tmpV=new THREE.Vector3();
function updateLabels(){
 const w=innerWidth,h=innerHeight;
 ZONES[currentCity].forEach(z=>{
  if(!z.anchor||!z.el)return;
  tmpV.set(z.anchor[0],z.anchor[1],z.anchor[2]).project(camera);
  const off=tmpV.z>1||tmpV.x<-1.05||tmpV.x>1.05||tmpV.y<-1.05||tmpV.y>1.05;
  if(off){z.el.style.display='none';return;}
  z.el.style.display='flex';
  z.el.style.left=((tmpV.x*.5+.5)*w)+'px';
  z.el.style.top=((-tmpV.y*.5+.5)*h)+'px';
 });
}

/* ================= حلقة الرسم ================= */
const clock=new THREE.Clock();
let loaderHidden=false;
const loaderEl=document.getElementById('loader');
function tick(){
 requestAnimationFrame(tick);
 const t=clock.getElapsedTime();
 if(camTween){
  const k=Math.min(1,(performance.now()-camTween.t0)/camTween.dur);
  const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  camera.position.lerpVectors(camTween.p0,camTween.p1,e);
  controls.target.lerpVectors(camTween.q0,camTween.q1,e);
  if(k>=1){camTween=null;controls.autoRotate=desiredRotate;}
 }
 controls.update();
 /* حركة السيارات */
 cars.forEach(c=>{
  const span=c.to-c.from;
  const d=((t*c.speed+c.off)%span+span)%span;
  const v=c.from+d;
  if(c.axis==='z')c.m.position.set(c.fixed,0,v);else c.m.position.set(v,0,c.fixed);
 });
 /* نبض صواعق تحذير الطائرات */
 beacons.forEach(b=>{b.m.opacity=.25+.75*(.5+.5*Math.sin(t*2.4+b.p));});
 updateLabels();
 renderer.render(scene,camera);
 if(!loaderHidden){
  loaderHidden=true;
  setTimeout(()=>{loaderEl.classList.add('done');setTimeout(()=>loaderEl.remove(),800);},450);
 }
}

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

/* ================= الإقلاع ================= */
applyAtmo('developed');
buildDock();buildLabels();
camera.position.set(ZONES.developed[0].cam.p[0],ZONES.developed[0].cam.p[1],ZONES.developed[0].cam.p[2]);
controls.target.set(ZONES.developed[0].cam.t[0],ZONES.developed[0].cam.t[1],ZONES.developed[0].cam.t[2]);
selectZone('dv-ov',false);
tick();
</script>
</body>
